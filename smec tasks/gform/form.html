<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Google Form Template</title>
</head>
<body>
    <div class="container">
        <form action="#" method="POST" class="google-form">
            <h1>Google Form Template</h1>
            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" name="destination" required>
                <label for="jobno">Job No:</label>
                <input type="number" id="jobno" name="jobno" required>
            </div>
            <div class="form-group">
                <label for="dcno">Dc No:</label>
                <input type="number" id="dcno" name="dcno" required>
                <label for="invoiceno">Invoice No:</label>
                <input type="number" id="invoiceno" name="invoiceno" required>
            </div>
            <div class="form-group">
                <label for="client">Client:</label>
                <input type="text" id="client" name="client" required>
                <label for="courier">Courier:</label>
                <input type="text" id="courier" name="courier" required>
            </div>
            <div class="form-group">
                <label for="transactionno">Transaction No:</label>
                <input type="number" id="transactionno" name="transactionno" required>
                <label for="noofboxes">No of Boxes:</label>
                <input type="number" id="noofboxes" name="noofboxes" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
